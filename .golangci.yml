version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      # staticcheck's own defaults, which CI ran as a separate step until the
      # staticcheck release could not read Go 1.27: SA, S1 (gosimple, merged in
      # by v2) and ST, less the style checks it leaves off. Not v2's default,
      # which adds the quick-fix (QF) suggestions -- a separate decision.
      checks:
        - "SA*"
        - "S1*"
        - "ST*"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
