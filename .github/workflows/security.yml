name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  # This job is expected to PASS. It was red from 2026-09-15 until 2026-10-04 on
  # GO-2026-4887 and GO-2026-4883 in github.com/docker/docker, both reported
  # "Fixed in: N/A" -- resolved by moving to github.com/moby/moby/client and
  # github.com/moby/moby/api, which are not affected. The legacy
  # +incompatible module was never going to be marked fixed.
  #
  # There is still no allowlist, and there should never be one: a suppression
  # quietly outlives the problem. Everything govulncheck reports is actionable --
  # fix it rather than filtering it.
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: go.sum
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Install dependencies
      run: go mod download
    
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
    
    - name: Run OSSF Scorecard
      uses: ossf/scorecard-action@v2.4.1
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true
      env:
        GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Detect secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        head: HEAD
        extra_args: --debug --only-verified

  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    
    - name: Install go-licenses
      run: go install github.com/google/go-licenses@latest
    
    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest
    
    - name: Check licenses
      run: |
        go-licenses check ./... 2>&1 | grep -v "does not have module info" || true
    
    - name: Generate license report
      run: |
        go-licenses report ./... --template tools/licenses.tpl 2>/dev/null || echo "License template not found, skipping detailed report"
    
    - name: Check for problematic licenses
      run: |
        # Check for known problematic licenses
        go-licenses csv ./... 2>&1 | grep -E "(GPL|AGPL|LGPL)" || echo "No GPL-family licenses found"