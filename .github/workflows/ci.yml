name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache-dependency-path: go.sum
    
    - name: Install dependencies
      run: go mod download
    
    - name: Run tests
      run: go test ./... -race
    
    - name: Run vet
      run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        check-latest: true
        cache-dependency-path: go.sum
    
    - name: Install golangci-lint
      run: |
        # v2: v1 cannot read Go 1.27 export data ("export data version 5 is
        # greater than maximum supported version 2")
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
    
    - name: Run golangci-lint
      run: $(go env GOPATH)/bin/golangci-lint run --timeout 5m

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.27']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache-dependency-path: go.sum
    
    - name: Install dependencies
      run: go mod download
    
    - name: Build
      run: go build -o running-man ./cmd/running-man
    
    - name: Test binary
      run: ./running-man --help || true