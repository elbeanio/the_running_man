openapi: 3.0.3
info:
  title: Running Man API
  description: |
    REST API for querying logs and managing processes in Running Man.
    
    Running Man is a dev observability tool that aggregates logs from multiple sources
    (processes and Docker containers) and provides a unified API for querying them.
    
    **Security Note**: This API is designed for local development use only and runs on localhost
    without authentication. It should not be exposed to public networks.
  version: 1.0.0
  license:
    name: MIT
  contact:
    name: Running Man
    url: https://github.com/elbeanio/the_running_man

servers:
  - url: http://localhost
    description: |
      Served on a Unix socket, not a TCP port: .running-man/api.sock inside the
      project directory (mode 0600). The host in the URL is ignored -- reach it
      with curl's --unix-socket, or an equivalent transport. No authentication,
      because the filesystem performs it.

tags:
  - name: logs
    description: Log query operations
  - name: processes
    description: Process management operations
  - name: health
    description: Health and status checks
  - name: traces
    description: |
      OpenTelemetry traces, in three levels of detail: summaries, one trace with values
      cut at 1 KB and 8 KB a span, one span in full. A caller spends context only on what
      it asks for.

paths:
  /:
    get:
      summary: List available API endpoints
      description: Returns a list of all available API endpoints with descriptions
      tags:
        - health
      responses:
        '200':
          description: List of available endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        method:
                          type: string
                        description:
                          type: string
  
  /health:
    get:
      summary: Get system health and statistics
      description: Returns system health status, uptime, log buffer and span storage statistics, and available log sources
      tags:
        - health
      responses:
        '200':
          description: System health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                uptime: "1h23m45s"
                uptime_seconds: 5025
                buffer:
                  total_entries: 15420
                  total_bytes: 2458960
                  max_entries: 100000
                  max_bytes: 104857600
                  max_age: "1h0m0s"
                  oldest_entry: "2026-02-09T22:00:00Z"
                  newest_entry: "2026-02-09T23:23:45Z"
                traces:
                  total_spans: 1830
                  total_bytes: 41943040
                  max_spans: 50000
                  max_bytes: 268435456
                  max_age: "24h0m0s"
                  oldest_span: "2026-02-09T21:30:00Z"
                  newest_span: "2026-02-09T23:23:40Z"
                sources:
                  - name: "running-man"
                    entry_count: 150
                    last_seen: "2026-02-09T23:23:45Z"
                  - name: "my-api"
                    entry_count: 8420
                    last_seen: "2026-02-09T23:23:44Z"
                  - name: "postgres-1"
                    entry_count: 6850
                    last_seen: "2026-02-09T23:23:43Z"

  /logs:
    get:
      summary: Query logs with filters
      description: |
        Retrieve log entries with optional filtering by time, level, source, and content.
        Supports glob patterns for source filtering and time-based queries.
      tags:
        - logs
      parameters:
        - name: since
          in: query
          description: Time duration to filter logs (e.g., "30s", "5m", "1h", "2h30m")
          required: false
          schema:
            type: string
            example: "30s"
        - name: level
          in: query
          description: Comma-separated log levels to filter (debug, info, warn, error)
          required: false
          schema:
            type: string
            example: "error,warn"
        - name: source
          in: query
          description: Comma-separated source names or glob patterns (e.g., "my-api", "postgres-*")
          required: false
          schema:
            type: string
            example: "my-api"
        - name: exclude
          in: query
          description: Comma-separated source exclusion patterns (supports globs)
          required: false
          schema:
            type: string
            example: "test-*"
        - name: contains
          in: query
          description: Filter logs containing this text in the message
          required: false
          schema:
            type: string
            example: "error connecting"
        - name: limit
          in: query
          description: |
            Maximum number of entries to return, keeping the MOST RECENT matches.
            Defaults to 1000. Use `limit=0` for no limit. Negative values are rejected.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 1000
            example: 100
      responses:
        '200':
          description: List of log entries matching the filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
              example:
                logs:
                  - timestamp: "2026-02-09T23:15:30Z"
                    level: "error"
                    source: "my-api"
                    message: "Failed to connect to database"
                    raw: "[2026-02-09 23:15:30] ERROR: Failed to connect to database"
                    stacktrace: ""
                  - timestamp: "2026-02-09T23:15:32Z"
                    level: "warn"
                    source: "my-api"
                    message: "Retrying connection in 5s"
                    raw: "[2026-02-09 23:15:32] WARN: Retrying connection in 5s"
                    stacktrace: ""
                count: 2
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "invalid since parameter: invalid duration format: 30x (expected: 30s, 5m, 1h)"

  /errors:
    get:
      summary: Get error logs only
      description: Retrieve only error-level log entries, optionally filtered by time
      tags:
        - logs
      parameters:
        - name: since
          in: query
          description: Time duration to filter errors (e.g., "30s", "5m", "1h")
          required: false
          schema:
            type: string
            example: "1h"
        - name: limit
          in: query
          description: |
            Maximum number of entries to return, keeping the MOST RECENT matches.
            Defaults to 1000. Use `limit=0` for no limit.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 1000
            example: 50
      responses:
        '200':
          description: List of error log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
              example:
                errors:
                  - timestamp: "2026-02-09T23:15:30Z"
                    level: "error"
                    source: "my-api"
                    message: "Failed to connect to database"
                    raw: "[2026-02-09 23:15:30] ERROR: Failed to connect to database"
                    stacktrace: "Traceback (most recent call last):\n  File \"app.py\", line 42, in connect\n    conn = psycopg2.connect(dsn)\npsycopg2.OperationalError: could not connect to server"
                count: 1
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /processes:
    get:
      summary: List all managed processes
      description: Returns information about all processes managed by Running Man
      tags:
        - processes
      responses:
        '200':
          description: List of managed processes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessesResponse'
              example:
                processes:
                  - name: "my-api"
                    command: "python server.py"
                    pid: 12345
                    status: "running"
                    exit_code: -1
                    start_time: "2026-02-09T22:00:00Z"
                  - name: "worker"
                    command: "npm run worker"
                    pid: 12346
                    status: "running"
                    exit_code: -1
                    start_time: "2026-02-09T22:00:05Z"
                count: 2
        '503':
          description: Process manager not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Process manager not available"

  /processes/{name}:
    get:
      summary: Get process details
      description: Returns detailed information about a specific managed process
      tags:
        - processes
      parameters:
        - name: name
          in: path
          description: Name of the process
          required: true
          schema:
            type: string
            example: "my-api"
      responses:
        '200':
          description: Process details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInfo'
              example:
                name: "my-api"
                command: "python server.py"
                pid: 12345
                status: "running"
                exit_code: -1
                start_time: "2026-02-09T22:00:00Z"
        '400':
          description: Invalid process name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid process name"
        '404':
          description: Process not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Process not found: my-api"
        '503':
          description: Process manager not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /processes/{name}/restart:
    post:
      summary: Restart a process
      description: |
        Stops and restarts the specified managed process.

        Reaching the socket at all requires permission to open a file in the project
        directory, so there is no additional caller check. The loopback-only 403 this
        endpoint used to return went away with the TCP port.
      tags:
        - processes
      parameters:
        - name: name
          in: path
          description: Name of the process to restart
          required: true
          schema:
            type: string
            example: "my-api"
      responses:
        '200':
          description: Process restart initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  process:
                    $ref: '#/components/schemas/ProcessInfo'
              example:
                message: "Process restarted successfully"
                process:
                  name: "my-api"
                  command: "python server.py"
                  pid: 12347
                  status: "running"
                  exit_code: -1
                  start_time: "2026-02-09T23:25:00Z"
        '400':
          description: Invalid process name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Process not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to restart process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to restart process: exit status 1"
        '503':
          description: Process manager not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /processes/stop-all:
    post:
      summary: Stop all managed processes
      description: |
        Gracefully stops all processes managed by Running Man.

        Reaching the socket at all requires permission to open a file in the project
        directory, so there is no additional caller check. The loopback-only 403 this
        endpoint used to return went away with the TCP port.
      tags:
        - processes
      responses:
        '200':
          description: All processes stopped successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  stopped_count:
                    type: integer
              example:
                message: "All processes stopped"
                stopped_count: 2
        '503':
          description: Process manager not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /traces:
    get:
      summary: Trace summaries
      description: |
        Trace summaries, newest first: enough to choose a trace. No span attributes, which
        can run to megabytes for a single trace. Span-level filters match a trace when any
        of its spans does.
      tags:
        - traces
      parameters:
        - {name: since, in: query, schema: {type: string}, description: "Traces with a span that started within this window, e.g. 10m"}
        - {name: service, in: query, schema: {type: string}, description: Traces with a span from this service}
        - {name: span_name, in: query, schema: {type: string}, description: Traces with a span whose name contains this}
        - {name: status, in: query, schema: {type: string, enum: [error, ok]}, description: "error: traces with any failing span"}
        - {name: limit, in: query, schema: {type: integer}, description: The newest N traces}
      responses:
        '200':
          description: Trace summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracesResponse'
        '400':
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /traces/{trace_id}:
    get:
      summary: One trace, values cut at 1 KB and 8 KB a span
      description: |
        The trace's summary and every span, in start order. Each attribute value, and each
        event attribute value, is cut at 1 KB, and a span's values together are held to
        8 KB: event attributes first, then the smallest values. A value that did not fit is
        left out of `attributes`; `truncated` gives the original size of every value cut
        or left out, so every key appears in one or the other.
      tags:
        - traces
      parameters:
        - {name: trace_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
        '404':
          description: Unknown trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /traces/{trace_id}/spans/{span_id}:
    get:
      summary: One span in full
      description: |
        One span, nothing cut. The step that returns large content, such as images sent to
        a model: ask for it deliberately, knowing its size from `truncated`.
      tags:
        - traces
      parameters:
        - {name: trace_id, in: path, required: true, schema: {type: string}}
        - {name: span_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The span
          content:
            application/json:
              schema:
                type: object
                properties:
                  trace_id: {type: string}
                  span: {$ref: '#/components/schemas/Span'}
        '404':
          description: Unknown trace or span
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /traces/{trace_id}/logs:
    get:
      summary: Log entries for a trace
      tags:
        - traces
      parameters:
        - {name: trace_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Every log entry carrying this trace ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'

components:
  schemas:
    LogEntry:
      type: object
      description: A single log entry
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the log was captured
        level:
          type: string
          enum: [debug, info, warn, error]
          description: |
            Log severity level, and the only signal of whether an entry is an error:
            `/errors` returns exactly the `error` entries. Set by the parsers from the
            entry's content: an explicit level, an unambiguous failure phrase, or the
            presence of a stack trace, which promotes an entry logged at a lower level.

            Arriving on stderr alone does NOT make an entry an error -- many tools write
            ordinary progress to stderr, so such entries are recorded at `warn`. Check
            `level=warn` as well as `/errors` when hunting a failure.
        source:
          type: string
          description: Name of the source that generated this log (process or container name)
        message:
          type: string
          description: Parsed log message content
        raw:
          type: string
          description: Original unparsed log line
        stacktrace:
          type: string
          description: Stack trace if this is an error with traceback (Python, etc.)
        source_type:
          type: string
          enum: [process, docker, system, traces, otlp]
          description: |
            What kind of producer the source is. `otlp` entries were POSTed to the
            OTLP receiver rather than captured from a process, so their source name
            and timestamp come from the sender.
        trace_id:
          type: string
          description: |
            Trace correlation ID, when the application emitted one. Use
            `GET /traces/{id}/logs` to fetch every entry for a trace.
      required:
        - timestamp
        - level
        - source
        - message
        - raw

    LogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        count:
          type: integer
          description: Number of log entries returned
        limit:
          type: integer
          description: The limit applied to this query (0 means no limit)
      required:
        - logs
        - count

    ErrorsResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        count:
          type: integer
          description: Number of error entries returned
      required:
        - errors
        - count

    ProcessInfo:
      type: object
      description: Information about a managed process
      properties:
        name:
          type: string
          description: Unique name of the process
        command:
          type: string
          description: Command used to start the process
        pid:
          type: integer
          description: Process ID (-1 if not started)
        status:
          type: string
          enum: [running, stopped, failed, waiting, pending, starting, blocked]
          description: |
            Current process status. `waiting` applies only to recurring processes
            (those with an `interval`): the last run finished successfully and the
            next is scheduled. Reporting that as `stopped` would read as "down",
            and as `running` would be untrue. A failed last run reports `failed`.

            Three statuses come from `depends_on`:

            - `pending` -- not started yet; a dependency is not ready.
            - `starting` -- running, but its own healthcheck has not passed, so
              anything depending on it is still waiting.
            - `blocked` -- will not start: a dependency never became ready and
              startup went no further. `startup_error` says why.
        exit_code:
          type: integer
          description: Exit code of the process (-1 for running processes)
        start_time:
          type: string
          format: date-time
          description: When the process was started
        interval:
          type: string
          description: |
            Interval for a recurring process (e.g. "30s", "1m"). Absent for ordinary
            long-running processes.
        ports:
          type: array
          items:
            type: integer
          description: |
            TCP ports this process (or any of its descendants) is listening on.
            Observed via the OS, not configured -- nothing in running-man.yml records a
            port. Absent when the process listens on nothing, has exited, or ports could
            not be determined, and a process that has just started may not have bound
            yet. A strong hint, not a guarantee.
        startup_error:
          type: string
          description: |
            Why startup stopped at this process: on a `blocked` process, the dependency
            that never became ready; on a running one, that its own healthcheck did not
            pass in time. Absent otherwise.
        depends_on:
          type: array
          items:
            type: string
          description: |
            The processes and Compose services this process waits for before it starts.
            Absent when it has none.
        healthcheck:
          type: string
          description: |
            How this process's readiness is checked, e.g. `port 8000` or
            `log "Application startup complete"`. Absent when it has none. A `running`
            process with a healthcheck and no `startup_error` has passed it.
      required:
        - name
        - command
        - pid
        - status
        - exit_code
        - start_time

    ProcessesResponse:
      type: object
      properties:
        processes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessInfo'
        count:
          type: integer
          description: Number of processes
        dependencies:
          type: array
          description: |
            The Compose services that processes depend on. Empty when no process
            depends on one.
          items:
            $ref: '#/components/schemas/DependencyInfo'
      required:
        - processes
        - count
        - dependencies

    DependencyInfo:
      type: object
      description: A Compose service that a process depends on
      properties:
        name:
          type: string
          description: The Compose service name
        state:
          type: string
          enum: [pending, checking, ready, failed]
          description: |
            `pending` until something waits on it, `checking` while its healthcheck is
            being checked, then `ready` or `failed`. Running Man does not start Compose
            services, so a service that has been up for days is `checking` too, briefly.
        detail:
          type: string
          description: Why it failed. Absent otherwise.
        sources:
          type: array
          items:
            type: string
          description: The log sources of the service's containers, for `/logs?source=`.
      required:
        - name
        - state

    SourceInfo:
      type: object
      description: Statistics about a log source
      properties:
        name:
          type: string
          description: Name of the source
        entry_count:
          type: integer
          description: Number of log entries from this source
        last_seen:
          type: string
          format: date-time
          description: Timestamp of the most recent log from this source
      required:
        - name
        - entry_count
        - last_seen

    BufferStats:
      type: object
      description: Statistics about the log buffer
      properties:
        total_entries:
          type: integer
          description: Total number of log entries in buffer
        total_bytes:
          type: integer
          format: int64
          description: Total size of log entries in bytes
        max_entries:
          type: integer
          description: Maximum number of entries buffer can hold
        max_bytes:
          type: integer
          format: int64
          description: Maximum size of buffer in bytes
        max_age:
          type: string
          description: Maximum age of logs before eviction (duration string)
        oldest_entry:
          type: string
          format: date-time
          description: Timestamp of oldest log entry
        newest_entry:
          type: string
          format: date-time
          description: Timestamp of newest log entry
      required:
        - total_entries
        - total_bytes
        - max_entries
        - max_bytes
        - max_age
        - oldest_entry
        - newest_entry

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: Overall system status
          example: "ok"
        uptime:
          type: string
          description: Human-readable uptime duration
          example: "1h23m45s"
        uptime_seconds:
          type: integer
          description: Uptime in seconds
        buffer:
          $ref: '#/components/schemas/BufferStats'
        traces:
          $ref: '#/components/schemas/SpanStats'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceInfo'
      required:
        - status
        - uptime
        - uptime_seconds
        - buffer
        - sources

    SpanStats:
      type: object
      description: |
        Span storage against its retention limits: max_spans, max_span_bytes and
        max_span_age. Whichever binds first evicts the oldest spans. Absent when tracing
        is disabled.
      properties:
        total_spans: {type: integer}
        total_bytes: {type: integer, description: "The bytes of the held spans' strings: IDs, names, attribute and event keys and values"}
        max_spans: {type: integer}
        max_bytes: {type: integer}
        max_age: {type: string, example: "24h0m0s"}
        oldest_span: {type: string, format: date-time, nullable: true, description: "When the oldest held span arrived"}
        newest_span: {type: string, format: date-time, nullable: true, description: "When the newest held span arrived"}
      required: [total_spans, total_bytes, max_spans, max_bytes, max_age, oldest_span, newest_span]

    TraceSummary:
      type: object
      properties:
        trace_id: {type: string}
        root_span: {type: string, description: "The span whose parent is not in the trace; the earliest if several"}
        summary:
          type: string
          description: |
            The root span's input.value, http.route, http.target or db.statement -- the
            first present -- on one line, at most 120 characters. Absent if none.
        start_time: {type: string, format: date-time}
        duration: {type: string, description: "Earliest span start to latest span end, e.g. 8.659s"}
        span_count: {type: integer}
        error_count: {type: integer}
        status: {type: string, enum: [ok, error]}
        services: {type: array, items: {type: string}}
      required: [trace_id, root_span, start_time, duration, span_count, error_count, status, services]

    TracesResponse:
      type: object
      properties:
        traces: {type: array, items: {$ref: '#/components/schemas/TraceSummary'}}
        count: {type: integer}
      required: [traces, count]

    Span:
      type: object
      properties:
        trace_id: {type: string}
        span_id: {type: string}
        parent_span_id: {type: string}
        name: {type: string}
        kind: {type: string}
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
        duration: {type: string}
        status: {type: string, enum: [ok, error, unset]}
        status_code: {type: string}
        service_name: {type: string}
        attributes: {type: object, additionalProperties: {type: string}}
        events:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              timestamp: {type: string, format: date-time}
              attributes: {type: object, additionalProperties: {type: string}}
        truncated:
          type: object
          additionalProperties: {type: integer}
          description: |
            In /traces/{trace_id} only: the original size in bytes of each value that was cut
            short or left out by the span budget, keyed by attribute (events as
            events.N.key). Absent when nothing was cut.

    TraceResponse:
      type: object
      properties:
        trace: {$ref: '#/components/schemas/TraceSummary'}
        spans: {type: array, items: {$ref: '#/components/schemas/Span'}}
        count: {type: integer}
      required: [trace, spans, count]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error
